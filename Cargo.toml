[package]
name = "kameo-remote-test"
version = "0.1.0"
edition = "2024"

[dependencies]
console-subscriber = "0.4.1"
env_logger = "0.11.8"
kameo = { version = "0.17.2", features = ["remote"] }
# libp2p = "0.56.0"
libp2p = { version = "0.55.0", features = ["tokio", "tcp"] }
libp2p-noise = "0.46.1"
libp2p-tls = "0.6.2"
libp2p-yamux = "0.47.0"
# libp2p = { version = "0.5.0", features = [
#     "cbor",
#     "dns",
#     "kad",
#     "mdns",
#     "macros",
#     "quic",
#     "request-response",
#     "rsa",
#     "serde",
#     "tokio",
# ], optional = true }
log = "0.4.27"
serde = { version = "1.0.219", features = ["derive"] }
tokio = { version = "1.45.1", features = [
    "macros",
    "rt",
    "sync",
    "time",
    "signal",
] }
tracing-subscriber = "0.3.19"


# Need for flamegraph
[profile.release]
debug = true